# Builds the web version of the game and publishes it free on GitHub Pages.
# Public URL: https://<owner>.github.io/<repo>/
# One-time setup: repo Settings → Pages → "Build and deployment" → Source: GitHub Actions.
# Optional leaderboards: Settings → Secrets and variables → Actions → Variables → BACKEND_URL
# (e.g. https://zeekay-api.onrender.com). Without it the game runs fully offline.
name: Deploy web game

on:
  push:
    branches: ["main", "claude/amazing-babbage-szh9fw"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Typecheck, lint, game tests
        run: npx tsc --noEmit && npx eslint . && yarn test
      - name: Export web build
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          npx expo export -p web
          cp dist/index.html dist/404.html   # deep links (e.g. /story) load the app
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
